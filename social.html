<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">

<title>Elsewhere — Viktor Palenychak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#F6F1E7;
  --ink:#173F2B;
  --ink-soft:#496454;
  --ink-faint:#7B8A7D;
  --accent:#730303;
  --accent-deep:#186B3C;
  --rule:#D8CEC0;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --paper:#151E19;
    --ink:#F1EBDD;
    --ink-soft:#B8C8BC;
    --ink-faint:#82958A;
    --accent:#B84A4A;
    --accent-deep:#59A078;
    --rule:#35453B;
  }
}
:root[data-theme="dark"]{
  --paper:#151E19;
  --ink:#F1EBDD;
  --ink-soft:#B8C8BC;
  --ink-faint:#82958A;
  --accent:#B84A4A;
  --accent-deep:#59A078;
  --rule:#35453B;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;
  font-size:1.125rem;
  font-weight:300;
  line-height:1.72;
  font-optical-sizing:auto;
}

.wrap{max-width:38rem;margin:0 auto;padding:0 1.5rem}

.masthead{
  display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:baseline;
  justify-content:space-between;padding:2.5rem 0 3.5rem;
}
.mark{
  font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:1.0625rem;
  text-decoration:none;color:var(--ink);
}
.masthead nav{display:flex;gap:1.5rem;font-size:1rem;flex-wrap:wrap}
.masthead nav a{
  color:var(--ink-soft);text-decoration:none;border-bottom:1px solid transparent;
  padding-bottom:2px
}
.masthead nav a:hover{color:var(--ink);border-bottom-color:var(--accent)}
.masthead nav a[aria-current="page"]{
  color:var(--ink);border-bottom-color:var(--accent-deep)
}

h1{
  font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:1.75rem;
  margin:0 0 2.5rem;letter-spacing:-.008em;
}

.elsewhere{
  list-style:none;margin:0 0 4rem;padding:0;border-top:1px solid var(--rule)
}
.elsewhere li{border-bottom:1px solid var(--rule)}
.elsewhere a{
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:1.15rem 0;text-decoration:none;color:var(--ink);
}
.elsewhere a:hover .name{color:var(--accent-deep)}
.elsewhere a:hover .icon{color:var(--accent)}
.elsewhere .left{display:flex;align-items:center;gap:.9rem}
.icon{
  width:1.35rem;height:1.35rem;flex-shrink:0;color:var(--ink-faint);
  transition:color .15s ease;
}
.icon svg{width:100%;height:100%;display:block}
.elsewhere .name{
  font-family:"Fraunces",serif;font-size:1.1875rem;font-weight:400
}
.elsewhere .handle{
  color:var(--ink-faint);font-size:.9375rem;white-space:nowrap
}

footer{
  border-top:1px solid var(--rule);padding:2.5rem 0 4rem;
  font-size:.9375rem;color:var(--ink-faint);text-align:center
}

a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
a{transition:color .15s ease}
</style>
</head>
